<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ping Pong - Táctil & IA</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #gameCanvas {
            background-color: #000;
            border: 4px solid #fff;
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Configuración del jugador humano (Izquierda)
        const player = {
            x: 10,
            y: canvas.height / 2 - 50,
            width: 15,
            height: 100,
            score: 0,
            color: "#00ffcc"
        };

        // Configuración del rival automático / IA (Derecha)
        const ai = {
            x: canvas.width - 25,
            y: canvas.height / 2 - 50,
            width: 15,
            height: 100,
            score: 0,
            color: "#ff0055",
            speed: 4.5 // Velocidad de reacción de la IA (ajusta para cambiar dificultad)
        };

        // Configuración de la pelota
        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 10,
            speed: 7,
            velocityX: 7,
            velocityY: 7,
            color: "#ffff00"
        };

        // --- CONTROLES TÁCTILES Y RATÓN ---
        // Obtiene la posición vertical relativa al canvas
        function movePaddle(clientY) {
            const rect = canvas.getBoundingClientRect();
            // Calcula la escala por si el canvas se encoge en pantallas chicas
            const scaleY = canvas.height / rect.height; 
            const canvasY = (clientY - rect.top) * scaleY;
            
            // Centra la paleta en el dedo/cursor y evita que salga de los bordes
            player.y = canvasY - player.height / 2;
            if (player.y < 0) player.y = 0;
            if (player.y > canvas.height - player.height) player.y = canvas.height - player.height;
        }

        // Evento para el ratón (PC)
        canvas.addEventListener("mousemove", (e) => {
            movePaddle(e.clientY);
        });

        // Eventos táctiles (Móviles)
        canvas.addEventListener("touchmove", (e) => {
            // Evita el scroll de la página mientras juegas
            e.preventDefault(); 
            if (e.touches.length > 0) {
                movePaddle(e.touches[0].clientY);
            }
        }, { passive: false });

        // --- LÓGICA DEL JUEGO ---

        // Reiniciar pelota al centro tras un punto
        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.speed = 7;
            ball.velocityX = -ball.velocityX; // Saca el que acaba de anotar
            ball.velocityY = (Math.random() > 0.5 ? 1 : -1) * 5; // Dirección Y aleatoria
        }

        // Detector de colisiones entre pelota y paletas
        function collision(b, p) {
            return b.x - b.radius < p.x + p.width &&
                   b.x + b.radius > p.x &&
                   b.y - b.radius < p.y + p.height &&
                   b.y + b.radius > p.y;
        }

        // Actualización de posiciones y físicas
        function update() {
            // Movimiento de la pelota
            ball.x += ball.velocityX;
            ball.y += ball.velocityY;

            // IA del rival automático (Sigue a la pelota suavemente)
            const aiTarget = ball.y - (ai.height / 2);
            ai.y += (aiTarget - ai.y) * 0.12; // El factor 0.12 determina la suavidad/reacción
            
            // Límites para la paleta de la IA
            if (ai.y < 0) ai.y = 0;
            if (ai.y > canvas.height - ai.height) ai.y = canvas.height - ai.height;

            // Rebote en paredes superior e inferior
            if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
                ball.velocityY = -ball.velocityY;
            }

            // Determinar qué paleta está en el camino de la pelota
            let playerActive = (ball.x < canvas.width / 2) ? player : ai;

            // Verificar si hay colisión con la paleta activa
            if (collision(ball, playerActive)) {
                // Punto de impacto relativo para dar ángulo al rebote
                let collidePoint = (ball.y - (playerActive.y + playerActive.height/2));
                collidePoint = collidePoint / (playerActive.height/2);
                
                let angleRad = (Math.PI/4) * collidePoint; // Ángulo máximo de 45 grados
                
                // Cambiar dirección X
                let direction = (ball.x < canvas.width / 2) ? 1 : -1;
                ball.velocityX = direction * ball.speed * Math.cos(angleRad);
                ball.velocityY = ball.speed * Math.sin(angleRad);
                
                // Incrementar velocidad gradualmente en cada golpe
                ball.speed += 0.5;
            }

            // Puntuación y fuera de juego
            if (ball.x - ball.radius < 0) {
                ai.score++;
                resetBall();
            } else if (ball.x + ball.radius > canvas.width) {
                player.score++;
                resetBall();
            }
        }

        // --- RENDERIZADO (DIBUJO EN PANTALLA) ---
        function render() {
            // Limpiar pantalla
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Línea central punteada
            ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]); // Resetear patrón de línea

            // Dibujar marcadores
            ctx.fillStyle = "#fff";
            ctx.font = "45px sans-serif";
            ctx.fillText(player.score, canvas.width / 4, 60);
            ctx.fillText(ai.score, (3 * canvas.width) / 4, 60);

            // Dibujar Paleta Jugador
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Dibujar Paleta IA
            ctx.fillStyle = ai.color;
            ctx.fillRect(ai.x, ai.y, ai.width, ai.height);

            // Dibujar Pelota
            ctx.fillStyle = ball.color;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.closePath();
            ctx.fill();
        }

        // Bucle principal del juego
        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        // Iniciar el juego
        gameLoop();
    </script>
</body>
</html>
